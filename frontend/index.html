<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar LDEM Explorer</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-mono overflow-hidden">
  <div id="globe" class="fixed inset-0"></div>

  <header class="fixed top-4 left-4 space-y-3 max-w-xs">
    <div class="bg-slate-900/80 backdrop-blur border border-slate-700 rounded-lg p-3">
      <h1 id="title" class="text-sm tracking-widest text-slate-100">LUNAR LDEM EXPLORER</h1>
      <p class="text-[11px] text-slate-400">Data: <span id="demSrc" class="text-amber-400">loading…</span> · click anywhere to sample</p>
    </div>
    <div role="group" aria-label="World" class="grid grid-cols-3 gap-1 bg-slate-900/80 border border-slate-700 rounded-lg p-1 text-xs">
      <button data-world="moon" class="rounded py-1.5 hover:bg-slate-800">Moon</button>
      <button data-world="mars" class="rounded py-1.5 hover:bg-slate-800">Mars</button>
      <button data-world="earth" class="rounded py-1.5 hover:bg-slate-800">Earth</button>
    </div>
    <button id="texBtn" class="w-full bg-slate-900/80 hover:bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-left">
      Surface: <span id="texName" class="text-amber-400"></span>
    </button>
    <div id="legend" class="bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-[11px] space-y-1"></div>
  </header>

  <aside id="card" class="hidden fixed top-4 right-4 bottom-4 w-[22rem] max-w-[calc(100vw-2rem)] overflow-y-auto bg-slate-900/85 backdrop-blur border border-slate-700 rounded-xl p-4 space-y-4 shadow-2xl">
    <div class="flex items-start justify-between gap-2">
      <div>
        <span id="badge" class="text-[10px] uppercase tracking-widest px-2 py-0.5 rounded border"></span>
        <h2 id="siteName" class="mt-2 text-lg text-slate-50"></h2>
        <p id="coords" class="text-xs text-slate-400"></p>
      </div>
      <button id="closeBtn" aria-label="Close telemetry" class="text-slate-500 hover:text-slate-200 text-xl leading-none">&times;</button>
    </div>
    <div id="metrics" class="space-y-4">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-slate-950/60 rounded-lg p-2"><div class="text-[10px] text-slate-500">ELEVATION</div><div id="elev" class="text-base text-slate-50">–</div><div class="text-[10px] text-slate-500">m</div></div>
      <div class="bg-slate-950/60 rounded-lg p-2"><div class="text-[10px] text-slate-500">MEAN SLOPE</div><div id="slope" class="text-base text-slate-50">–</div><div class="text-[10px] text-slate-500">°</div></div>
      <div class="bg-slate-950/60 rounded-lg p-2"><div class="text-[10px] text-slate-500">ROUGHNESS</div><div id="rough" class="text-base text-slate-50">–</div><div class="text-[10px] text-slate-500">±m</div></div>
    </div>
    <div>
      <div class="text-[10px] text-slate-500 mb-1">W → E ELEVATION PROFILE (21 px)</div>
      <div class="h-40"><canvas id="profile"></canvas></div>
    </div>
    </div>
    <p id="status" class="text-[11px] text-slate-500"></p>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <button id="poleBtn" class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-lg py-2">Fly to Artemis South Pole (-85°S)</button>
      <button id="eqBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg py-2">Equatorial View</button>
    </div>
  </aside>

  <div id="attrib" class="fixed bottom-2 left-4 text-[10px] text-slate-400 bg-slate-950/60 px-2 py-0.5 rounded">Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community</div>

<script>
const HYPSO = './lunar_hypsometric.png?v=64';
const BUMP = './lunar_bumpmap.png?v=64';
const MARS = './mars_viking.jpg';
const ESRI = (x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${l}/${y}/${x}`;
const ESRI_PLACES = (x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/${l}/${y}/${x}`;
const WORLDS = {
  moon:  { title: 'LUNAR LDEM EXPLORER', tiles: 10, base: 'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/moon-landing-sites/lunar_surface.jpg',
           tileName: 'Kaguya TC · ~21 m/px tiles', altName: 'LOLA False-Color Elevation', alt: HYPSO,
           credit: 'Imagery: JAXA/SELENE Kaguya Terrain Camera via NASA Moon Trek' },
  mars:  { title: 'MARS EXPLORER', src: 'MRO CTX 5 m/px + Viking color · imagery only', tiles: 12, base: MARS,
           tileName: 'CTX 5 m/px detail + Viking color', altName: 'Viking Color Mosaic', alt: MARS,
           credit: 'Imagery: NASA/JPL/MSSS/Caltech Murray Lab/Esri (CTX) · Viking: NASA/USGS',
           note: 'Mars imagery has no elevation data. Add a Mars MOLA DEM to get elevation, slope and profile.' },
  earth: { title: 'EARTH IMAGERY EXPLORER', src: 'Esri World Imagery · tiles to z19 (sub-meter)',
           credit: 'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community',
           note: 'Esri World Imagery is imagery only, no elevation data. Scroll to zoom down to street level.' },
};
const CAT = {
  artemis:  { label: 'Artemis III South Pole', rgb: [245, 158, 11],  cls: 'text-amber-300 border-amber-500/60' },
  lavatube: { label: 'Lava Tube Skylight',     rgb: [34, 211, 238],  cls: 'text-cyan-300 border-cyan-400/60' },
  apollo:   { label: 'Apollo Benchmark',       rgb: [16, 185, 129],  cls: 'text-emerald-300 border-emerald-500/60' },
  landing:  { label: 'Rover Landing Site',     rgb: [251, 113, 133], cls: 'text-rose-300 border-rose-400/60' },
  icebase:  { label: 'Ice-Rich Base Zone',     rgb: [96, 165, 250],  cls: 'text-blue-300 border-blue-400/60' },
  analog:   { label: 'Known Earth Analog',     rgb: [167, 139, 250], cls: 'text-violet-300 border-violet-400/60' },
  custom:   { label: 'Surface Query',          rgb: [226, 232, 240], cls: 'text-slate-300 border-slate-500' },
};
const rgba = (c, a) => `rgba(${CAT[c].rgb.join(',')},${a})`;
const $ = id => document.getElementById(id);

const globe = new Globe($('globe'))
  .bumpImageUrl(BUMP)
  .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.45.0/example/img/night-sky.png')
  .showAtmosphere(false)
  .showGraticules(true)
  .pointLat('lat').pointLng('lng')
  .pointColor(d => rgba(d.category, 1))
  .pointAltitude(0.05).pointRadius(0.45)
  .pointLabel(d => `<div class="bg-slate-900/90 px-2 py-1 rounded text-xs">${d.name}</div>`)
  .onPointClick(d => select(d.lat, d.lng, d.name, d.category))
  .ringLat('lat').ringLng('lng')
  .ringColor(d => t => rgba(d.category, 1 - t))
  .ringMaxRadius(3).ringPropagationSpeed(1.5).ringRepeatPeriod(1200)
  .onGlobeClick(({ lat, lng }) => select(lat, lng, 'Surface Query', 'custom'))
  .htmlElement(d => d.el).htmlAltitude(d => d.category ? pinAlt : 0).htmlTransitionDuration(0);
globe.globeMaterial().bumpScale = 12; // strong relief so crater walls and polar massifs pop
globe.globeTileEngineMaxLevel(19);
// globe.gl stops the camera ~3.5 km above Earth; letting it reach ~700 m brings z18-19 tiles into view.
// The near plane follows the altitude (see onZoom below) so depth precision holds both up close and far out.
globe.controls().minDistance = 100.011;
const fitNearPlane = altitude => {
  globe.camera().near = Math.max(0.005, altitude * globe.getGlobeRadius() * 0.1);
  globe.camera().updateProjectionMatrix();
};
fitNearPlane(2.2);
// Chrome allows 6 connections per host; localhost and 127.0.0.1 count separately, doubling tile throughput
const TILE_HOSTS = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? ['localhost', '127.0.0.1'].map(h => `${location.protocol}//${h}:${location.port}`) : [location.origin];
globe.pointOfView({ lat: -60, lng: 20, altitude: 2.2 });

// globe.gl's own tile engine is Web Mercator only (cuts off beyond ±85°, i.e. the lunar south pole), so the NASA
// Moon/Mars tiles use a second instance of the same class in equirectangular mode. Served via /tiles in app.py.
let eqTiles, placeTiles;
function initEqTiles() { // globe.gl adds its globe group to the scene asynchronously, so wait for it
  const globeGroup = globe.scene().getObjectByProperty('__globeObjType', 'globe');
  if (!globeGroup) return requestAnimationFrame(initEqTiles);
  const TileEngine = globeGroup.children.find(o => 'tileUrl' in o).constructor;
  eqTiles = new TileEngine(globe.getGlobeRadius(), { mercatorProjection: false });
  globeGroup.add(eqTiles);
  // Earth place names: Esri's transparent reference tiles, a hair above the imagery (below the closest camera stop)
  placeTiles = new TileEngine(globe.getGlobeRadius() * 1.00005, { mercatorProjection: true });
  placeTiles.add = o => { o.material.transparent = true; return TileEngine.prototype.add.call(placeTiles, o); }; // engine builds opaque tiles
  placeTiles.maxLevel = 19;
  globeGroup.add(placeTiles);
  // base image sits just under the tiles and shows wherever they haven't loaded yet
  globeGroup.children.find(o => o.material === globe.globeMaterial()).scale.setScalar(0.998);
  globe.onZoom(({ altitude }) => {
    fitNearPlane(altitude);
    eqTiles.updatePov(globe.camera());
    placeTiles.updatePov(globe.camera());
    clearTimeout(labelTimer);
    labelTimer = setTimeout(placeLabels, 150); // re-pick labels once the camera settles
  });
  setWorld(world);
}
addEventListener('resize', () => { globe.width(innerWidth).height(innerHeight); placeLabels(); });

// Site names always come first; Gazetteer names follow largest-first, skipping any too small to see at this zoom
// or overlapping a label already placed, so the globe never shows more than ~150 at once.
const RADIUS_KM = { moon: 1737.4, mars: 3389.5 };
const RAD = Math.PI / 180;
const arc = (lat1, lng1, lat2, lng2) => Math.acos(Math.min(1,
  Math.sin(lat1 * RAD) * Math.sin(lat2 * RAD) + Math.cos(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.cos((lng1 - lng2) * RAD)));
let labelPool = [], labelTimer, pinAlt = 0.05;
function labelEl(d) {
  const el = document.createElement('div');
  el.className = d.category ? 'pointer-events-none whitespace-nowrap text-[11px] font-semibold pb-7'
                            : 'pointer-events-none whitespace-nowrap text-[10px] text-slate-100';
  el.style.textShadow = '0 0 3px #000, 0 0 2px #000';
  if (d.category) el.style.color = rgba(d.category, 1);
  el.textContent = d.name;
  return el;
}
function placeLabels() {
  const { lat, lng, altitude } = globe.pointOfView();
  pinAlt = Math.min(0.05, altitude * 0.03); // pins and rings shrink when zoomed in so they don't bury terrain and labels
  globe.pointAltitude(pinAlt).pointRadius(Math.min(0.45, altitude * 0.3)).ringMaxRadius(Math.min(3, altitude * 2));
  const horizon = Math.acos(1 / (1 + altitude)); // anything farther from the view center is behind the globe
  const pxPerRad = innerHeight / (0.93 * altitude); // screen px per radian of surface at the view center (50° fov)
  const placed = [], shown = [];
  for (const d of labelPool) {
    if (shown.length >= 150) break;
    if (d.diam && d.diam / RADIUS_KM[world] * pxPerRad < 30) break; // pool is sorted, so every later feature is smaller too
    if (arc(lat, lng, d.lat, d.lng) > horizon) continue;
    const { x, y } = globe.getScreenCoords(d.lat, d.lng, d.category ? pinAlt : 0);
    const w = d.name.length * 6.5 + 10, h = 16, cy = d.category ? y - 14 : y; // site names sit above their pin
    if (x + w / 2 < 0 || x - w / 2 > innerWidth || cy < 0 || cy > innerHeight) continue;
    if (placed.some(p => Math.abs(p.x - x) * 2 < p.w + w && Math.abs(p.y - cy) * 2 < p.h + h)) continue;
    placed.push({ x, y: cy, w, h });
    d.el ||= labelEl(d);
    shown.push(d);
  }
  globe.htmlElementsData(shown);
}

let sitesBy = {}, featuresBy = {};
function showSites() {
  const s = sitesBy[world] || [];
  globe.pointsData(s).ringsData(s);
  $('legend').innerHTML = [...new Set(s.map(d => d.category))].map(c =>
    `<div><span class="inline-block w-2 h-2 rounded-full mr-2" style="background:${rgba(c, 1)}"></span>${CAT[c].label}</div>`).join('');
  $('legend').classList.toggle('hidden', !s.length);
  // a site already names its feature ("Gale Crater (Curiosity)" covers "Gale"), so skip the duplicate
  labelPool = [...s, ...(featuresBy[world] || []).filter(f => !s.some(d => d.name === f.name || d.name.startsWith(f.name + ' ')))];
  placeLabels();
}

let showAlt = false; // false = detailed tiles, true = the world's single-image alternative (LOLA colors / Viking color)
function applySurface() {
  const cfg = WORLDS[world], tiled = !!cfg.tiles && !showAlt;
  eqTiles.visible = tiled;
  globe.globeImageUrl((tiled ? cfg.base : cfg.alt) || null); // in tile mode a whole-globe image fills in until tiles load
  $('texName').textContent = showAlt ? cfg.altName : cfg.tileName;
}
$('texBtn').onclick = () => { if (!eqTiles) return; showAlt = !showAlt; applySurface(); };

const chart = new Chart($('profile'), {
  type: 'line',
  data: { labels: [], datasets: [{ data: [], borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,.15)', fill: true, pointRadius: 0, tension: .3, borderWidth: 2 }] },
  options: {
    maintainAspectRatio: false, animation: { duration: 400 },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.parsed.y.toFixed(0)} m` } } },
    scales: {
      x: { ticks: { color: '#64748b', maxTicksLimit: 5 }, grid: { color: '#1e293b' }, title: { display: true, text: 'km from site', color: '#64748b' } },
      y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
    },
  },
});

let seq = 0;
async function select(lat, lng, name, category) {
  const id = ++seq;
  globe.pointOfView({ lat, lng, altitude: Math.min(globe.pointOfView().altitude, 0.9) }, 1500); // never zoom out on click
  $('card').classList.remove('hidden');
  $('siteName').textContent = name;
  $('badge').textContent = CAT[category].label;
  $('badge').className = `text-[10px] uppercase tracking-widest px-2 py-0.5 rounded border ${CAT[category].cls}`;
  $('coords').textContent = `LAT ${lat.toFixed(4)}° / LNG ${lng.toFixed(4)}°`;
  $('metrics').classList.toggle('hidden', world !== 'moon');
  if (world !== 'moon') {
    $('status').textContent = WORLDS[world].note;
    return;
  }
  $('status').textContent = 'Sampling LDEM…';
  try {
    const r = await fetch(`/api/query?lat=${lat}&lng=${lng}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (id !== seq) return; // a newer click superseded this one
    $('elev').textContent = d.elev_m.toFixed(0);
    $('slope').textContent = d.slope_deg.toFixed(1);
    $('rough').textContent = d.roughness_m.toFixed(0);
    chart.data.labels = d.profile.map((_, i) => ((i - 10) * d.profile_step_km).toFixed(1));
    chart.data.datasets[0].data = d.profile;
    chart.data.datasets[0].borderColor = rgba(category === 'custom' ? 'artemis' : category, 1);
    chart.update();
    $('status').textContent = `${d.source} · ${d.m_per_px} m/px · 5×5 window`;
  } catch (e) {
    if (id === seq) $('status').textContent = `Query failed: ${e.message}`;
  }
}

$('closeBtn').onclick = () => $('card').classList.add('hidden');
$('poleBtn').onclick = () => globe.pointOfView({ lat: -85, lng: 30, altitude: 0.8 }, 2000);
$('eqBtn').onclick = () => globe.pointOfView({ lat: 0, lng: 0, altitude: 2.2 }, 2000);

let world = 'moon', moonSrc = 'loading…';
function setWorld(w) {
  world = w;
  const moon = w === 'moon';
  const earth = w === 'earth';
  globe.globeTileEngineUrl(earth ? ESRI : null)
    .bumpImageUrl(moon ? BUMP : null)
    .showAtmosphere(earth).showGraticules(!earth);
  placeTiles.tileUrl = earth ? ESRI_PLACES : null;
  placeTiles.visible = earth;
  showSites();
  $('poleBtn').classList.toggle('hidden', !moon);
  $('texBtn').classList.toggle('hidden', earth);
  $('attrib').textContent = WORLDS[w].credit;
  eqTiles.clearTiles();
  eqTiles.maxLevel = WORLDS[w].tiles || 0;
  eqTiles.tileUrl = WORLDS[w].tiles ? (x, y, l) => `${TILE_HOSTS[(x + y) % TILE_HOSTS.length]}/tiles/${w}/${l}/${x}/${y}.jpg?v=2` : null; // bump v when tile rendering changes
  eqTiles.updatePov(globe.camera());
  showAlt = false;
  applySurface();
  $('title').textContent = WORLDS[w].title;
  $('demSrc').textContent = moon ? moonSrc : WORLDS[w].src;
  document.querySelectorAll('[data-world]').forEach(b => {
    const on = b.dataset.world === w;
    b.setAttribute('aria-pressed', on);
    b.classList.toggle('bg-amber-500/20', on);
    b.classList.toggle('text-amber-300', on);
  });
  $('card').classList.add('hidden');
  seq++; // drop any in-flight lunar query
}
document.querySelectorAll('[data-world]').forEach(b => b.onclick = () => eqTiles && setWorld(b.dataset.world));
initEqTiles();

for (const w of Object.keys(WORLDS)) {
  fetch(`/api/sites?body=${w}`).then(r => r.json()).then(data => {
    sitesBy[w] = data;
    if (w === 'moon') {
      moonSrc = `${data[0].source} · ${data[0].m_per_px} m/px`;
      if (world === 'moon') $('demSrc').textContent = moonSrc;
    }
    if (w === world && placeTiles) showSites();
  })
    .catch(e => console.error(`Failed to load ${w} sites`, e));
}
for (const w of Object.keys(RADIUS_KM)) { // USGS Gazetteer names, generated by build_labels() in app.py
  fetch(`./labels_${w}.json`).then(r => r.json()).then(data => {
    featuresBy[w] = data.map(([name, lat, lng, diam]) => ({ name, lat, lng, diam }));
    if (w === world && placeTiles) showSites();
  })
    .catch(e => console.error(`Failed to load ${w} labels`, e));
}
</script>
</body>
</html>
