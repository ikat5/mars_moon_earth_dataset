# Checks that run without Git LFS objects or large downloads. Data-dependent tests (release fixtures,
# HTTP search parity, browser workflow) skip here and run locally after `git lfs pull`; see analysis/RUNBOOK.md.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r processing/requirements.txt -r frontend/requirements.txt -r requirements-dev.txt
      - name: Unit tests (data-dependent tests skip without LFS data)
        env:
          TERRATWIN_PREWARM: "0"
          TERRATWIN_FETCH_LABELS: "0"
        run: python -m pytest processing frontend/test_api.py -q -rs
      - name: JavaScript syntax
        run: |
          node --check frontend/terratwin.js
          python -c "import re;open('/tmp/inline.js','w').write(re.findall(r'<script>(.*?)</script>',open('frontend/index.html').read(),re.S)[0])"
          node --check /tmp/inline.js
      - name: Server starts and reports missing data as unavailable, not as results
        env:
          TERRATWIN_PREWARM: "0"
          TERRATWIN_FETCH_LABELS: "0"
        run: |
          uvicorn --app-dir frontend app:app --port 8000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8000/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"body":"mars","lat":18.41,"lon":77.69,"profile":"dry_barren_terrain"}' http://localhost:8000/api/v1/search)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/app.py)" = 404
